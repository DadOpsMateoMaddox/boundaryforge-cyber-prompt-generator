[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundaryforge"
version = "0.1.0"
description = "Automated contrastive prompt generator for cybersecurity LLM red-teaming."
readme = "README.md"
license = {text = "BoundaryForge Research and Evaluation License — non-commercial use only; commercial/enterprise use requires written permission"}
requires-python = ">=3.10"
authors = [
    {name = "BoundaryForge Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.30.0"]
yaml = ["pyyaml>=6.0"]
test = ["pytest>=7.0.0"]
all = [
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
]

[project.scripts]
boundaryforge = "prompt_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
